<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuschat (Live)</title>
    
    <!-- FIREBASE SDK (Versi 8 agar mudah dipasang di 1 file HTML) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        /* TAMPILAN (CSS) SAMA SEPERTI SEBELUMNYA */
        :root { --bg-color: #000; --panel-color: #1a1a1a; --primary-color: #800080; --primary-hover: #9932cc; --text-color: #fff; --text-muted: #aaa; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; height: 100vh; overflow: hidden; }
        button { background-color: var(--primary-color); color: var(--text-color); border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background-color: var(--primary-hover); }
        input[type="text"] { width: 100%; padding: 10px; margin-bottom: 15px; background-color: var(--bg-color); border: 1px solid var(--primary-color); color: var(--text-color); border-radius: 5px; }
        #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; }
        .login-box { background-color: var(--panel-color); padding: 40px; border-radius: 10px; text-align: center; border: 2px solid var(--primary-color); width: 350px; }
        .login-btn { width: 100%; margin: 10px 0; padding: 12px; font-size: 16px; }
        #app-screen { display: none; width: 100%; height: 100%; }
        .sidebar { width: 300px; background-color: var(--panel-color); border-right: 1px solid var(--primary-color); display: flex; flex-direction: column; }
        .profile-section { padding: 20px; border-bottom: 1px solid var(--primary-color); text-align: center; }
        .profile-img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; border: 2px solid var(--primary-color); }
        .sidebar-actions { display: flex; gap: 5px; padding: 10px; justify-content: center; flex-wrap: wrap; }
        .sidebar-actions button { flex: 1 1 45%; font-size: 12px; }
        .list-container { flex: 1; overflow-y: auto; padding: 10px; }
        .list-item { background-color: var(--bg-color); padding: 10px; border-radius: 5px; margin-bottom: 10px; border-left: 4px solid var(--primary-color); cursor: pointer; }
        .chat-area { flex: 1; display: flex; flex-direction: column; background-color: var(--bg-color); }
        .chat-header { padding: 20px; background-color: var(--panel-color); border-bottom: 1px solid var(--primary-color); }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .chat-input { padding: 20px; background-color: var(--panel-color); display: flex; gap: 10px; }
        .chat-input input { margin-bottom: 0; flex: 1; }
        .msg-bubble { padding: 10px 15px; border-radius: 15px; max-width: 70%; word-wrap: break-word; }
        .msg-mine { background-color: var(--primary-color); align-self: flex-end; border-radius: 15px 15px 0 15px; }
        .msg-other { background-color: #333; align-self: flex-start; border-radius: 15px 15px 15px 0; }
        .sender-name { font-size: 10px; color: var(--text-muted); margin-bottom: 3px; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-screen">
        <div class="login-box">
            <h1>Nuschat</h1>
            <p style="margin-bottom: 30px;">Login untuk mulai chatting</p>
            <button class="login-btn" onclick="loginWithGoogle()">Masuk dengan Google</button>
            <p style="font-size: 12px; margin-top: 15px; color: var(--text-muted);">Facebook Login dinonaktifkan sementara untuk konfigurasi Firebase.</p>
        </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="app-screen">
        <div class="sidebar">
            <div class="profile-section">
                <img id="my-profile-img" class="profile-img" src="" alt="Profile">
                <h3 id="my-name">Nama</h3>
                <p id="my-code" style="font-size: 12px; color: var(--primary-hover); margin-bottom: 10px;"></p>
            </div>
            
            <div class="sidebar-actions">
                <button onclick="createGroup()">Buat Grup</button>
                <button onclick="joinGroup()">Masuk Grup</button>
            </div>

            <div class="list-container" id="contact-list">
                <!-- Daftar Grup Muncul di Sini -->
            </div>
        </div>

        <div class="chat-area" id="chat-area" style="display: none;">
            <div class="chat-header">
                <h3 id="active-chat-name">Nama Obrolan</h3>
                <p style="font-size: 12px; color: var(--primary-hover);" id="active-chat-code">Kode: -</p>
            </div>
            <div class="chat-messages" id="chat-messages">
                <!-- Pesan Live Masuk di Sini -->
            </div>
            <div class="chat-input">
                <input type="text" id="msg-input" placeholder="Ketik pesan..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button onclick="sendMessage()">Kirim</button>
            </div>
        </div>
    </div>

    <script>
        // ========================================================
        // 1. MASUKKAN KODE FIREBASE ANDA DI SINI
        // ========================================================
        const firebaseConfig = {
             apiKey: "AIzaSyALWO9uJj3cVuj3sUZN94RmcQOyZMJhMr4",
             authDomain: "chat-8a8ea.firebaseapp.com",
             projectId: "chat-8a8ea",
             storageBucket: "chat-8a8ea.firebasestorage.app",
             messagingSenderId: "354917456159",
             appId: "1:354917456159:web:228ee45e8f14d018d8b82a",
             measurementId: "G-RE9X7FX92C"
        };
        
        // Inisialisasi Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        const auth = firebase.auth();

        // Variabel Global
        let currentUser = null;
        let activeGroupCode = null;
        let activeChatListener = null;

        // ========================================================
        // 2. SISTEM LOGIN ASLI (GOOGLE)
        // ========================================================
        function loginWithGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).then((result) => {
                const user = result.user;
                // Generate Kode 7-XXXXX khusus user ini jika belum punya
                const userCode = '7-' + user.uid.substring(0, 5).toUpperCase();
                
                currentUser = {
                    uid: user.uid,
                    name: user.displayName,
                    photo: user.photoURL,
                    code: userCode
                };
                
                // Simpan/Update data user di Database
                db.ref('users/' + user.uid).set(currentUser);
                showAppScreen();
                loadMyGroups();
            }).catch((error) => {
                alert("Gagal Login: " + error.message);
            });
        }

        function showAppScreen() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'flex';
            document.getElementById('my-name').innerText = currentUser.name;
            document.getElementById('my-code').innerText = "Kode: " + currentUser.code;
            document.getElementById('my-profile-img').src = currentUser.photo;
        }

        // Cek jika pengguna sudah login sebelumnya
        auth.onAuthStateChanged((user) => {
            if (user) {
                const userCode = '7-' + user.uid.substring(0, 5).toUpperCase();
                currentUser = { uid: user.uid, name: user.displayName, photo: user.photoURL, code: userCode };
                showAppScreen();
                loadMyGroups();
            }
        });

        // ========================================================
        // 3. FITUR GRUP (REAL DATABASE)
        // ========================================================
        function generateGroupCode() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }

        function createGroup() {
            const groupName = prompt("Masukkan Nama Grup:");
            if (!groupName) return;

            const code = generateGroupCode();
            const groupData = { name: groupName, code: code, createdBy: currentUser.uid };

            // Simpan grup ke database
            db.ref('groups/' + code).set(groupData).then(() => {
                // Tambahkan user ini sebagai anggota grup
                db.ref('user_groups/' + currentUser.uid + '/' + code).set(true);
                alert(`Grup "${groupName}" Berhasil Dibuat!\nKODE GRUP: ${code}\nBagikan kode ini ke teman Anda.`);
            });
        }

        function joinGroup() {
            const code = prompt("Masukkan 6 Digit Kode Grup:");
            if (!code || code.length !== 6) return;

            // Cek apakah grup ada di database
            db.ref('groups/' + code).once('value').then((snapshot) => {
                if (snapshot.exists()) {
                    // Masukkan user ke grup tersebut
                    db.ref('user_groups/' + currentUser.uid + '/' + code).set(true);
                    alert("Berhasil bergabung ke grup!");
                } else {
                    alert("Grup tidak ditemukan!");
                }
            });
        }

        function loadMyGroups() {
            // Dengarkan perubahan pada daftar grup milik user ini
            db.ref('user_groups/' + currentUser.uid).on('value', (snapshot) => {
                const listContainer = document.getElementById('contact-list');
                listContainer.innerHTML = '';
                
                snapshot.forEach((childSnapshot) => {
                    const groupCode = childSnapshot.key;
                    // Ambil detail grup berdasarkan kodenya
                    db.ref('groups/' + groupCode).once('value').then((groupSnap) => {
                        if(groupSnap.exists()) {
                            const groupInfo = groupSnap.val();
                            const item = document.createElement('div');
                            item.className = 'list-item';
                            item.innerHTML = `<h4>${groupInfo.name}</h4><p style="font-size:12px; color:var(--text-muted)">Kode: ${groupInfo.code}</p>`;
                            item.onclick = () => openChat(groupInfo.code, groupInfo.name);
                            listContainer.appendChild(item);
                        }
                    });
                });
            });
        }

        // ========================================================
        // 4. SISTEM CHAT (REALTIME)
        // ========================================================
        function openChat(code, name) {
            activeGroupCode = code;
            document.getElementById('chat-area').style.display = 'flex';
            document.getElementById('active-chat-name').innerText = name;
            document.getElementById('active-chat-code').innerText = "Kode: " + code;
            
            const msgBox = document.getElementById('chat-messages');
            msgBox.innerHTML = ''; // Bersihkan layar chat

            // Matikan listener chat lama jika ada (agar tidak bentrok)
            if (activeChatListener) {
                db.ref('messages/' + activeGroupCode).off('child_added', activeChatListener);
            }

            // Dengarkan pesan baru secara Live
            activeChatListener = db.ref('messages/' + code).on('child_added', (snapshot) => {
                const msgData = snapshot.val();
                
                const msgDiv = document.createElement('div');
                msgDiv.className = 'msg-bubble ' + (msgData.uid === currentUser.uid ? 'msg-mine' : 'msg-other');
                
                if (msgData.uid !== currentUser.uid) {
                    msgDiv.innerHTML = `<div class="sender-name">${msgData.sender}</div>${msgData.text}`;
                } else {
                    msgDiv.innerText = msgData.text;
                }

                msgBox.appendChild(msgDiv);
                msgBox.scrollTop = msgBox.scrollHeight; // Auto scroll
            });
        }

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text || !activeGroupCode) return;

            const msgData = {
                text: text,
                sender: currentUser.name,
                uid: currentUser.uid,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            };

            // Kirim pesan ke database Firebase
            db.ref('messages/' + activeGroupCode).push(msgData);
            input.value = '';
        }
    </script>
</body>
</html>
